name: Build CYBERNOIZZ VST3 (Windows x64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Ninja + MSVC x64 Release with AVX2 & LTCG)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build CYBERNOIZZ VST3 & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Stage Distributable Package (VST3 + Factory Cabinet IR WAVs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CYBERNOIZZ_VST3
          $vst3Path = Get-ChildItem -Path build -Recurse -Directory -Filter "CYBERNOIZZ.vst3" | Select-Object -First 1
          if ($null -eq $vst3Path) {
            Write-Error "CYBERNOIZZ.vst3 bundle not found in build directory!"
            exit 1
          }
          Copy-Item -Recurse -Force $vst3Path.FullName "dist/CYBERNOIZZ_VST3/"
          $exePath = Get-ChildItem -Path build -Recurse -File -Filter "CYBERNOIZZ.exe" | Select-Object -First 1
          if ($null -ne $exePath) {
            Copy-Item -Force $exePath.FullName "dist/CYBERNOIZZ_VST3/"
          }
          Copy-Item -Recurse -Force "Resources/IRs" "dist/CYBERNOIZZ_VST3/Factory_IRs"

      - name: Upload CYBERNOIZZ Windows x64 VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYBERNOIZZ-Windows-x64-VST3
          path: dist/CYBERNOIZZ_VST3
          if-no-files-found: error
