name: Build CYBERNOIZZ VST3 (Windows x64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Release with AVX2 & LTCG)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build CYBERNOIZZ VST3 & Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Stage Distributable Package (VST3 + Factory Cabinet IR WAVs)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CYBERNOIZZ_VST3
          Copy-Item -Recurse -Force "build/CYBERNOIZZ_artefacts/Release/VST3/CYBERNOIZZ.vst3" "dist/CYBERNOIZZ_VST3/"
          if (Test-Path "build/CYBERNOIZZ_artefacts/Release/Standalone/CYBERNOIZZ.exe") {
            Copy-Item -Force "build/CYBERNOIZZ_artefacts/Release/Standalone/CYBERNOIZZ.exe" "dist/CYBERNOIZZ_VST3/"
          }
          Copy-Item -Recurse -Force "Resources/IRs" "dist/CYBERNOIZZ_VST3/Factory_IRs"

      - name: Upload CYBERNOIZZ Windows x64 VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CYBERNOIZZ-Windows-x64-VST3
          path: dist/CYBERNOIZZ_VST3
          if-no-files-found: error
